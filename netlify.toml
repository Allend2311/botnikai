[build]
  command = "npm run build:shared && npm run db:generate && npm --workspace @guardbot/web run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_ENV = "production"
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  APP_URL = "https://kaibots.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"
